<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I'm Get Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%B1</text></svg>">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --line:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#3fb950;
    --accent2:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%, #1b2430 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:560px;
    text-align:center;
  }
  .mark{
    width:168px;height:168px;
    margin:0 auto 28px;
    display:block;
    filter:drop-shadow(0 10px 30px rgba(88,166,255,.22));
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  .mark .draw{
    stroke-dasharray:1;
    stroke-dashoffset:1;
    animation:draw 2.2s ease-out forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){
    .mark,.mark .draw{animation:none;stroke-dashoffset:0}
  }
  h1{
    font-size:clamp(2.2rem,8vw,3.4rem);
    margin:0 0 10px;
    letter-spacing:-.02em;
    font-weight:800;
  }
  h1 span{color:var(--accent)}
  p.sub{
    color:var(--muted);
    font-size:1.05rem;
    margin:0 0 28px;
    line-height:1.6;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:26px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(63,185,80,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 9px rgba(63,185,80,0)}
    100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 22px;
    text-align:left;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.9rem;
    line-height:1.9;
    color:var(--muted);
  }
  .panel b{color:var(--text);font-weight:600}
  .panel .k{color:var(--accent2)}
  footer{
    margin-top:26px;
    color:#6e7681;
    font-size:.8rem;
  }
  @media (max-width:420px){
    .mark{width:120px;height:120px}
    .panel{font-size:.82rem;padding:16px}
  }
</style>
</head>
<body>
  <main class="card">

    <svg class="mark" viewBox="0 0 200 200" role="img" aria-label="Line-art cat">
      <g fill="none" stroke="#e6edf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- tail -->
        <path class="draw" pathLength="1" d="M156 174 C186 174 194 150 176 140 C167 135 157 141 158 152"/>
        <!-- body + head outline -->
        <path class="draw" pathLength="1" d="M68 78 L66 40 L88 64 C96 60 104 60 112 64 L134 40 L132 78
          C140 92 140 106 130 116 C146 128 156 150 156 174 L44 174
          C44 150 54 128 70 116 C60 106 60 92 68 78 Z"/>
        <!-- inner ears -->
        <path class="draw" pathLength="1" d="M73 52 L73 68 L84 66 Z" stroke-width="2.4" opacity=".65"/>
        <path class="draw" pathLength="1" d="M127 52 L127 68 L116 66 Z" stroke-width="2.4" opacity=".65"/>
        <!-- eyes -->
        <path class="draw" pathLength="1" d="M78 93 c4 7 12 7 16 0"/>
        <path class="draw" pathLength="1" d="M106 93 c4 7 12 7 16 0"/>
        <!-- nose + mouth -->
        <path class="draw" pathLength="1" d="M96 106 l4 4 l4 -4" stroke-width="2.8"/>
        <path class="draw" pathLength="1" d="M100 110 c0 6 -7 8 -11 4" stroke-width="2.6"/>
        <path class="draw" pathLength="1" d="M100 110 c0 6 7 8 11 4" stroke-width="2.6"/>
        <!-- whiskers -->
        <g stroke-width="2.2" opacity=".5">
          <path class="draw" pathLength="1" d="M72 102 L34 96"/>
          <path class="draw" pathLength="1" d="M72 110 L32 112"/>
          <path class="draw" pathLength="1" d="M128 102 L166 96"/>
          <path class="draw" pathLength="1" d="M128 110 L168 112"/>
        </g>
      </g>
    </svg>

    <div class="badge"><span class="dot"></span> live on GitHub Pages</div>

    <h1>I'm <span>Get Hub</span></h1>
    <p class="sub">This page lives in a GitHub repo — not on Vercel.<br>Push to <b>main</b> and it updates itself.</p>

    <div class="panel">
      <div><span class="k">host</span> &nbsp;&nbsp;&nbsp;GitHub Pages</div>
      <div><span class="k">repo</span> &nbsp;&nbsp;&nbsp;drz-glitch/im-get-hub</div>
      <div><span class="k">branch</span> &nbsp;main</div>
      <div><span class="k">file</span> &nbsp;&nbsp;&nbsp;index.html</div>
      <div><span class="k">vercel</span> &nbsp;<b>none</b> — on purpose</div>
    </div>

    <footer>built by drz · <span id="y"></span></footer>
  </main>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
