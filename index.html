<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I'm Get Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%B1</text></svg>">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --line:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#3fb950;
    --accent2:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%, #1b2430 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:560px;
    text-align:center;
  }
  .mark{
    width:150px;height:150px;
    margin:0 auto 28px;
    display:block;
    filter:drop-shadow(0 10px 30px rgba(63,185,80,.25));
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  .mark .blink{animation:blink 4.5s infinite}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    95%{transform:scaleY(.08)}
  }
  h1{
    font-size:clamp(2.2rem,8vw,3.4rem);
    margin:0 0 10px;
    letter-spacing:-.02em;
    font-weight:800;
  }
  h1 span{color:var(--accent)}
  p.sub{
    color:var(--muted);
    font-size:1.05rem;
    margin:0 0 28px;
    line-height:1.6;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:26px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(63,185,80,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 9px rgba(63,185,80,0)}
    100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 22px;
    text-align:left;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.9rem;
    line-height:1.9;
    color:var(--muted);
  }
  .panel b{color:var(--text);font-weight:600}
  .panel .k{color:var(--accent2)}
  footer{
    margin-top:26px;
    color:#6e7681;
    font-size:.8rem;
  }
  @media (max-width:420px){
    .mark{width:120px;height:120px}
    .panel{font-size:.82rem;padding:16px}
  }
</style>
</head>
<body>
  <main class="card">

    <svg class="mark" viewBox="0 0 200 200" role="img" aria-label="Cat mark">
      <defs>
        <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e6edf3"/>
          <stop offset="100%" stop-color="#a9b4c0"/>
        </linearGradient>
      </defs>
      <!-- ears -->
      <path d="M42 74 L46 26 L86 52 Z" fill="url(#fur)"/>
      <path d="M158 74 L154 26 L114 52 Z" fill="url(#fur)"/>
      <path d="M53 66 L55 41 L76 57 Z" fill="#f0a3a3"/>
      <path d="M147 66 L145 41 L124 57 Z" fill="#f0a3a3"/>
      <!-- head -->
      <ellipse cx="100" cy="108" rx="62" ry="54" fill="url(#fur)"/>
      <!-- eyes -->
      <g class="blink" style="transform-origin:78px 100px">
        <ellipse cx="78" cy="100" rx="9" ry="12" fill="#0d1117"/>
        <circle cx="81" cy="95" r="3" fill="#fff"/>
      </g>
      <g class="blink" style="transform-origin:122px 100px">
        <ellipse cx="122" cy="100" rx="9" ry="12" fill="#0d1117"/>
        <circle cx="125" cy="95" r="3" fill="#fff"/>
      </g>
      <!-- nose + mouth -->
      <path d="M94 122 L106 122 L100 129 Z" fill="#f0a3a3"/>
      <path d="M100 129 q-8 9 -15 2" stroke="#0d1117" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 129 q8 9 15 2" stroke="#0d1117" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- whiskers -->
      <g stroke="#0d1117" stroke-width="2.5" stroke-linecap="round" opacity=".55">
        <path d="M62 116 L26 110"/><path d="M62 124 L26 128"/>
        <path d="M138 116 L174 110"/><path d="M138 124 L174 128"/>
      </g>
    </svg>

    <div class="badge"><span class="dot"></span> live on GitHub Pages</div>

    <h1>I'm <span>Get Hub</span></h1>
    <p class="sub">This page lives in a GitHub repo — not on Vercel.<br>Push to <b>main</b> and it updates itself.</p>

    <div class="panel">
      <div><span class="k">host</span> &nbsp;&nbsp;&nbsp;GitHub Pages</div>
      <div><span class="k">repo</span> &nbsp;&nbsp;&nbsp;drz-glitch/im-get-hub</div>
      <div><span class="k">branch</span> &nbsp;main</div>
      <div><span class="k">file</span> &nbsp;&nbsp;&nbsp;index.html</div>
      <div><span class="k">vercel</span> &nbsp;<b>none</b> — on purpose</div>
    </div>

    <footer>built by drz · <span id="y"></span></footer>
  </main>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
